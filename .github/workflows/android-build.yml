name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false

      - name: Show versions
        run: |
          echo "Godot:"
          godot --version

          echo "Java:"
          java -version

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Install Godot Android templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -O /tmp/templates.tpz

          rm -rf /tmp/godot-export
          mkdir -p /tmp/godot-export

          unzip -q /tmp/templates.tpz -d /tmp/godot-export

          cp -R \
            /tmp/godot-export/templates/. \
            "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Verify templates
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"

          echo "Godot export templates:"
          ls -lah "$TEMPLATE_DIR"

          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

          echo "Android export templates OK"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"

          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            > "$HOME/.config/godot/editor_settings-4.tres"

          echo "Godot Android configuration:"
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Verify project configuration
        run: |
          echo "===== PROJECT ====="
          cat project.godot

          echo "===== EXPORT PRESET ====="
          cat export_presets.cfg

          echo "===== ANDROID SDK ====="
          ls -lah "$ANDROID_HOME/platforms/android-34"
          ls -lah "$ANDROID_HOME/build-tools/34.0.0"

      - name: Import Godot project
        run: |
          godot \
            --headless \
            --editor \
            --verbose \
            --path . \
            --quit

      - name: Verify Godot debug keystore
        run: |
          echo "===== GODOT KEYSTORE ====="

          test -f "$HOME/.local/share/godot/keystores/debug.keystore"

          ls -lah \
            "$HOME/.local/share/godot/keystores/debug.keystore"

      - name: Build Android APK
        run: |
          mkdir -p build

          godot \
            --headless \
            --verbose \
            --path . \
            --export-debug "Android" \
            "build/ShockerOwnZ-GrowEmpire.apk"

      - name: Verify APK
        run: |
          test -f "build/ShockerOwnZ-GrowEmpire.apk"

          echo "APK CREATED SUCCESSFULLY"

          ls -lh \
            "build/ShockerOwnZ-GrowEmpire.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShockerOwnZ-GrowEmpire-Android
          path: build/ShockerOwnZ-GrowEmpire.apk
          if-no-files-found: error
