name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.3.0'
          use-dotnet: false

      - name: Show Godot version
        run: godot --version

      - name: Install Android SDK requirements
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

          test -d "$ANDROID_HOME" || exit 1
          test -d "$JAVA_HOME" || exit 1

          echo "Installed Android platforms:"
          ls -la "$ANDROID_HOME/platforms"

          echo "Installed Android build tools:"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Install Godot Android export templates
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"

          mkdir -p "$TEMPLATE_DIR"

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -O /tmp/godot_templates.tpz

          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates

          unzip -q /tmp/godot_templates.tpz -d /tmp/godot_templates

          cp -R /tmp/godot_templates/templates/. "$TEMPLATE_DIR/"

      - name: Verify Godot Android
