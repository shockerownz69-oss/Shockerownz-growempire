name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.3.0'
          use-dotnet: false

      - name: Install Godot Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          cp -r templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Create build folder
        run: mkdir -p build

      - name: Build Android APK
        run: godot --headless --path . --export-debug "Android" build/ShockerOwnZ-GrowEmpire.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShockerOwnZ-GrowEmpire-Android
          path: build/ShockerOwnZ-GrowEmpire.apk
